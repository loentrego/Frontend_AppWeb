<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3422A8">
<title>LoEntrego — App de Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="img/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoEntrego">

</head>
<body>

<main class="device login">

  <!-- ============ ZONA DE MARCA ============ -->
  <section class="brand-zone login-hero" aria-labelledby="login-title">
    <svg class="city city-art" viewBox="0 0 400 360" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
      
      <g>
        <path class="c-street" d="M26 0V360 M78 0V360 M130 0V360 M182 0V360 M234 0V360 M286 0V360 M338 0V253 M338 299V360 M390 0V360 M0 23H400 M0 69H234 M286 69H400 M0 115H400 M0 161H338 M390 161H400 M0 207H400 M0 253H400 M0 299H400 M0 345H400 M0 345 L234 207 L400 3"/>
        <circle class="c-node" cx="26" cy="207" r="2.6"/><circle class="c-node" cx="26" cy="253" r="2.6"/><circle class="c-hub" cx="78" cy="69" r="4" style="--d:2.4s"/><circle class="c-node" cx="78" cy="115" r="2.6"/><circle class="c-node" cx="78" cy="161" r="2.6"/><circle class="c-hub" cx="78" cy="207" r="4" style="--d:0.0s"/><circle class="c-node" cx="78" cy="253" r="2.6"/><circle class="c-node" cx="130" cy="115" r="2.6"/><circle class="c-node" cx="130" cy="161" r="2.6"/><circle class="c-node" cx="130" cy="299" r="2.6"/><circle class="c-node" cx="182" cy="23" r="2.6"/><circle class="c-node" cx="182" cy="69" r="2.6"/><circle class="c-hub" cx="182" cy="115" r="4" style="--d:0.3s"/><circle class="c-node" cx="182" cy="161" r="2.6"/><circle class="c-node" cx="182" cy="253" r="2.6"/><circle class="c-node" cx="182" cy="345" r="2.6"/><circle class="c-node" cx="234" cy="207" r="2.6"/><circle class="c-hub" cx="234" cy="299" r="4" style="--d:1.2s"/><circle class="c-node" cx="234" cy="345" r="2.6"/><circle class="c-node" cx="286" cy="115" r="2.6"/><circle class="c-node" cx="286" cy="207" r="2.6"/><circle class="c-node" cx="338" cy="23" r="2.6"/><circle class="c-node" cx="390" cy="23" r="2.6"/><circle class="c-node" cx="390" cy="253" r="2.6"/><circle class="c-node" cx="390" cy="299" r="2.6"/>
        <path class="c-glow" pathLength="100" d="M0 69H26V115H400" style="--t:3.6s;--w:0.3s"/><path class="c-comet" pathLength="100" d="M0 69H26V115H400" style="--t:3.6s;--w:0.3s"/><path class="c-glow" pathLength="100" d="M390 360V115H26V0" style="--t:4.5s;--w:1.0s"/><path class="c-comet" pathLength="100" d="M390 360V115H26V0" style="--t:4.5s;--w:1.0s"/><path class="c-glow" pathLength="100" d="M0 345 L234 207 L400 3" style="--t:5.4s;--w:1.7s"/><path class="c-comet" pathLength="100" d="M0 345 L234 207 L400 3" style="--t:5.4s;--w:1.7s"/><path class="c-glow" pathLength="100" d="M234 360V161H78V0" style="--t:3.6s;--w:2.4s"/><path class="c-comet" pathLength="100" d="M234 360V161H78V0" style="--t:3.6s;--w:2.4s"/><path class="c-glow" pathLength="100" d="M0 69H78V115H400" style="--t:4.5s;--w:3.1s"/><path class="c-comet" pathLength="100" d="M0 69H78V115H400" style="--t:4.5s;--w:3.1s"/><path class="c-glow" pathLength="100" d="M26 360V253H286V0" style="--t:5.4s;--w:3.8s"/><path class="c-comet" pathLength="100" d="M26 360V253H286V0" style="--t:5.4s;--w:3.8s"/><path class="c-glow" pathLength="100" d="M0 253H390V69H400" style="--t:3.6s;--w:4.5s"/><path class="c-comet" pathLength="100" d="M0 253H390V69H400" style="--t:3.6s;--w:4.5s"/><path class="c-glow" pathLength="100" d="M130 360V299H338V0" style="--t:4.5s;--w:5.2s"/><path class="c-comet" pathLength="100" d="M130 360V299H338V0" style="--t:4.5s;--w:5.2s"/>
      </g>
    </svg>

    <img class="login-logo" src="img/LoEntrego2026-wordmark.png" alt="LoEntrego — Logística de última milla" width="1383" height="374">

    <div class="login-copy">
      <h1 id="login-title">Cada entrega,<br><span class="text-accent">en movimiento.</span></h1>
    </div>
  </section>

  <!-- ============ PANEL DE ACCESO ============ -->
  <section class="login-panel" aria-labelledby="login-form-title">
    <div class="login-panel-head">
      <h2 id="login-form-title">Inicia sesión</h2>
      <p>Ingresa con tu cuenta de LoEntrego para continuar.</p>
    </div>

    <form class="login-form" id="login-form" novalidate>

      <div class="field">
        <label class="field-label" for="usuario">Usuario</label>
        <input class="field-input" type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>

      <div class="field">
        <label class="field-label" for="password">Contraseña</label>
        <div class="password-wrap">
          <input class="field-input" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
          <button type="button" class="toggle-password" id="toggle-password" data-action="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>

      <p class="login-error" id="login-error" role="alert" aria-live="assertive"></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <span class="login-btn-text">Ingresar</span>
        <svg class="btn-icon btn-icon-move" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

    </form>

    <footer class="login-foot">
      <span class="isotipo isotipo-xs" aria-hidden="true"></span>
      <span>© 2026 LoEntrego · Bogotá, Colombia</span>
    </footer>
  </section>

</main>

<script src="Scripts/Scripts-index.js?v=20261122q"></script>
<script src="libs/gsap/gsap.min.js"></script>
<script src="libs/gsap/ScrollTrigger.min.js"></script>
<script src="libs/gsap/SplitText.min.js"></script>
<script src="libs/gsap/DrawSVGPlugin.min.js"></script>
<script src="Scripts/Scripts-motion.js?v=20261122q"></script>
<script src="Scripts/Scripts-pwa.js?v=20261122q"></script>
</body>
</html>
