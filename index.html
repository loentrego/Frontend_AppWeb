<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3422A8">
<title>LoEntrego — App de Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Styles/Styles-base.css?v=20261122o">
<link rel="stylesheet" href="Styles/Styles-index.css?v=20261122o">
<link rel="icon" href="img/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoEntrego">
<script src="Scripts/Scripts-theme.js?v=20261122o"></script>
</head>
<body>

<main class="device login">

  <!-- ============ ZONA DE MARCA ============ -->
  <section class="brand-zone login-hero" aria-labelledby="login-title">
    <svg class="route-art" viewBox="0 0 390 380" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
      <defs>
        <pattern id="login-route-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#fff"/></pattern>
        <radialGradient id="login-route-fade" cx="80%" cy="25%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <mask id="login-route-gridmask" maskUnits="userSpaceOnUse"><rect width="390" height="380" fill="url(#login-route-fade)"/></mask>
        <mask id="login-route-reveal" maskUnits="userSpaceOnUse"><path class="route-mask" d="M 170 -10 C 230 40, 250 92, 312 100 S 382 150, 412 232" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/></mask>
      </defs>
      <g class="route-grid" mask="url(#login-route-gridmask)"><rect x="-22" y="-22" width="434" height="424" fill="url(#login-route-grid)"/></g>
      <path id="login-route-path" class="route-line" d="M 170 -10 C 230 40, 250 92, 312 100 S 382 150, 412 232" mask="url(#login-route-reveal)"/>
      <path class="route-comet-glow" d="M 170 -10 C 230 40, 250 92, 312 100 S 382 150, 412 232"/>
      <path class="route-comet" d="M 170 -10 C 230 40, 250 92, 312 100 S 382 150, 412 232"/>
      <g class="route-ripples"><circle class="ripple" cx="312" cy="100" r="6"/><circle class="ripple" cx="312" cy="100" r="6"/><circle class="ripple" cx="312" cy="100" r="6"/></g>
      <circle class="route-halo" cx="312" cy="100" r="14"/>
      <circle class="route-dot" cx="312" cy="100" r="6"/>
    </svg>

    <img class="login-logo" src="img/LoEntrego2026-wordmark.png" alt="LoEntrego — Logística de última milla" width="1383" height="374">

    <div class="login-copy">
      <h1 id="login-title">Cada entrega,<br><span class="text-accent">en movimiento.</span></h1>
    </div>
  </section>

  <!-- ============ PANEL DE ACCESO ============ -->
  <section class="login-panel" aria-labelledby="login-form-title">
    <div class="login-panel-head">
      <h2 id="login-form-title">Inicia sesión</h2>
      <p>Ingresa con tu cuenta de LoEntrego para continuar.</p>
    </div>

    <form class="login-form" id="login-form" novalidate>

      <div class="field">
        <label class="field-label" for="usuario">Usuario</label>
        <input class="field-input" type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>

      <div class="field">
        <label class="field-label" for="password">Contraseña</label>
        <div class="password-wrap">
          <input class="field-input" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
          <button type="button" class="toggle-password" id="toggle-password" data-action="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>

      <p class="login-error" id="login-error" role="alert" aria-live="assertive"></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <span class="login-btn-text">Ingresar</span>
        <svg class="btn-icon btn-icon-move" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

    </form>

    <footer class="login-foot">
      <span class="isotipo isotipo-xs" aria-hidden="true"></span>
      <span>© 2026 LoEntrego · Bogotá, Colombia</span>
    </footer>
  </section>

</main>

<script src="Scripts/Scripts-index.js?v=20261122o"></script>
<script src="libs/gsap/gsap.min.js"></script>
<script src="libs/gsap/ScrollTrigger.min.js"></script>
<script src="libs/gsap/SplitText.min.js"></script>
<script src="libs/gsap/DrawSVGPlugin.min.js"></script>
<script src="Scripts/Scripts-motion.js?v=20261122o"></script>
<script src="Scripts/Scripts-pwa.js?v=20261122o"></script>
</body>
</html>
