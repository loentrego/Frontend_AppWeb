<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoEntrego — App de Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Styles/Styles-index.css">
<link rel="icon" href="img/Minilogo-transparencia.png">
</head>
<body>

<div class="phone">

  <div class="login-screen" id="login-screen">
    <div class="login-card">

      <img class="logo-screen-lock" src="img/LoEntrego2026-logo.png" alt="LoEntrego">

      <p class="login-subtitle">Inicia sesión para continuar</p>

      <form id="login-form" autocomplete="off">

        <div class="field">
          <label class="field-label" for="usuario">Usuario</label>
          <input class="field-input" type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
        </div>

        <div class="field">
          <label class="field-label" for="password">Contraseña</label>
          <div class="password-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">Ver</button>
          </div>
        </div>

        <div class="login-error" id="login-error"></div>

        <button type="submit" class="login-btn" id="login-btn">
          <span class="login-btn-text">Ingresar</span>
        </button>

      </form>

    </div>
  </div>

</div>

<script src="Scripts/Scripts-index.js"></script>
</body>
</html>
